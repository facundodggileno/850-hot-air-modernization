name: Publish first ESP32-S3 stable release
on:
  push:
    branches: [main]
    paths:
      - 'firmware/esp32/**'
      - 'hardware/esp32-s3-*'
      - 'docs/releases/esp32-v3.4.2.md'
      - '.github/workflows/release-esp32.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release-esp32-s3:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify stable firmware and GPIO mapping
        run: python tools/validate_esp32_stable.py
      - name: Render vector diagram as PDF and PNG
        run: |
          python -m pip install --disable-pip-version-check cairosvg
          python - <<'PY'
          import cairosvg
          svg='hardware/esp32-s3-wiring-v3.4.2.svg'
          cairosvg.svg2pdf(url=svg,write_to='Hony850Pro_ESP32S3_v3_4_2_Pinout.pdf')
          cairosvg.svg2png(url=svg,write_to='Hony850Pro_ESP32S3_v3_4_2_Pinout.png',output_width=1920)
          PY
      - name: Build firmware-only ZIP
        run: |
          cd firmware/esp32
          zip -qr ../../Hony850Pro_ESP32S3_v3_4_2_Firmware.zip Hony850Pro_ESP32S3_v3_4_2
      - name: Create the GitHub Release (idempotent)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG=esp32-v3.4.2
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; skipping duplicate."
          else
            gh release create "$TAG" \
              --title "Hony 850 Pro — ESP32-S3 V3.4.2 (primera release estable)" \
              --notes-file docs/releases/esp32-v3.4.2.md \
              --target "$GITHUB_SHA" \
              Hony850Pro_ESP32S3_v3_4_2_Firmware.zip \
              Hony850Pro_ESP32S3_v3_4_2_Pinout.pdf \
              Hony850Pro_ESP32S3_v3_4_2_Pinout.png
          fi

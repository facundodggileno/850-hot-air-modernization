name: Repository structure and documentation
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  repository-check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check files, Markdown links and document integrity
        run: python tools/validate_repository.py
